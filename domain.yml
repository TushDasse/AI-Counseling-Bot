version: "3.1"

intents:
- greet
- goodbye
- ask_fees
- ask_first_installment
- ask_second_installment
- ask_course_details
- ask_course_list_by_level
- ask_courses_general        
- ask_registration_status
- ask_admission_requirements
- ask_degree_duration
- ask_exemptions
- ask_contact_info
- ask_program_calendar
- ask_regional_centres
- ask_exam_schedule
- ask_drop_policy
- mood_unhappy
- ask_assignment
- ask_pre_academic_courses
- ask_student_support
- ask_registration_process
- ask_why_ousl

entities:
- course_code
- level_number
- student_id
- module_code
- course_name

slots:
  course_code:
    type: text
    mappings:
    - type: from_entity
      entity: course_code
  level_number:
    type: text
    mappings:
    - type: from_entity
      entity: level_number
  student_id:
    type: text
    mappings:
    - type: from_entity
      entity: student_id

actions:
- action_give_course_details
- action_check_registration_status
- action_check_exam_date
- action_two_stage_fallback

responses:
  utter_greet:
    - text: "Hello! I am the OUSL BSc IT Assistant. How can I help you today?"

  utter_goodbye:
    - text: "Goodbye! Good luck with your studies."

  # --- NEW: Course Level Selection ---
  utter_ask_which_level:
    - text: "The BSc IT programme covers four levels. Which level would you like to see?"
      buttons:
      - title: "Level 3 (Year 1)"
        payload: '/ask_course_list_by_level{"level_number":"3"}'
      - title: "Level 4 (Year 2)"
        payload: '/ask_course_list_by_level{"level_number":"4"}'
      - title: "Level 5 (Year 3)"
        payload: '/ask_course_list_by_level{"level_number":"5"}'
      - title: "Level 6 (Honours)"
        payload: '/ask_course_list_by_level{"level_number":"6"}'

  # --- FEES ---
  utter_ask_fees:
    - text: |
        **BSc IT Fee Overview:**
        Tuition: **Rs. 3,010 per credit**.
        1. **First Installment:** 60% of tuition + Registration fees.
        2. **Second Installment:** 40% of tuition + Lab fees.

  utter_ask_first_installment:
    - text: |
        **First Installment (Due at Registration):**
        * **60%** of Tuition Fees.
        * **Plus Fixed Fees:** Rs. 11,700 (Pre-academic, Reg, Facilities, Lab Deposit, Library).

  utter_ask_second_installment:
    - text: "The Second Installment is the remaining **40%** of tuition + Lab fees, due ~5 months after registration."

  # --- EXAMS ---
  utter_ask_exam_schedule:
    - text: "The specific exam dates for the 2026/2027 academic year are **Coming Soon**."

  # --- GENERAL ---
  utter_ask_admission_requirements:
    - text: "You need **Three (03) Passes in A/L** OR the **OUSL Foundation Certificate**."

  utter_ask_degree_duration:
    - text: "Min: 3 years. Max: 9 years. Honours: 4 years."

  utter_ask_exemptions:
    - text: "Exemptions available for HND, NDT, BCS, or BIT holders. Apply by **15th August**."

  utter_ask_contact_info:
    - text: "CS Dept Head: 011-2881097 (hdcs@ou.ac.lk). Dean: 011-2881258."

  utter_ask_program_calendar:
    - text: "Selection Test: **02 Aug 2025**. Registration: **25-27 Sept 2025**."

  utter_ask_regional_centres:
    - text: "Centers in Colombo, Kandy, Matara, Jaffna, Anuradhapura, Batticaloa."

  utter_ask_student_support:
    - text: "We offer Counsellors, Day Schools, and Online Support."

  utter_ask_registration_process:
    - text: "Bring NIC, Birth Cert, Photos, A/L Cert, and Payment Voucher to a Regional Centre."

  utter_ask_why_ousl:
    - text: "Flexible learning, recognized degree, affordable fees."

  utter_ask_pre_academic_courses:
    - text: "Compulsory: English (EGAP), Math, and Communication Skills."

  utter_ask_drop_policy:
    - text: "Drop within **4 weeks** for a 75% refund. No refunds after that."

  utter_mood_unhappy:
    - text: "I'm sorry you feel this way. Please contact the Student Counsellor at **011-2881258**."

  utter_ask_assignment_clarification:
    - text: "Which assignment? Java, Web, or Database?"

  utter_default:
    - text: "I didn't understand. Try asking about Fees, Courses, or Exams."